<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>micro1 — Mobile Interview Prep Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="micro1.css?v=6">
</head>
<body>
    <header class="site-nav">
        <div class="site-nav-inner">
            <div class="brand">Prep Lab · <strong>micro1</strong></div>
            <a class="docs-home" href="index.html">Docs</a>
            <nav class="site-nav-links" aria-label="Prep sections">
                <a class="nav-link" data-view="sheet" href="#sheet">Cheat sheet</a>
                <a class="nav-link" data-view="cram" href="#cram">10 min</a>
                <a class="nav-link" data-view="interview" href="#interview">Interview</a>
                <a class="nav-link" data-view="stories" href="#stories">Stories</a>
                <a class="nav-link" data-view="drills" href="#drills">Drills</a>
            </nav>
            <div class="nav-tools">
                <div class="timer-chip idle" id="timerChip" aria-live="polite">00:00</div>
                <button type="button" class="text-btn" id="focusToggle">Focus</button>
            </div>
        </div>
    </header>

    <main id="app">Loading…</main>

    <div class="help-overlay" id="help" hidden>
        <div class="help-card">
            <h2>Keyboard</h2>
            <p><span class="kbd">?</span> this help · <span class="kbd">f</span> focus mode.</p>
            <p>Interview mode: <span class="kbd">←</span> <span class="kbd">→</span> previous/next · <span class="kbd">space</span> show or hide the answer.</p>
            <p class="muted">Shortcuts are ignored while typing in a field. Timer stays in the header so you don't need to scroll.</p>
            <button type="button" class="text-btn primary" id="helpClose">Close</button>
        </div>
    </div>

    <script src="micro1-data.js?v=6"></script>
    <script src="micro1-sheet.js?v=6"></script>
    <script src="micro1.js?v=7"></script>
</body>
</html>
