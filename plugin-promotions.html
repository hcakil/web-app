<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plugin Promotions — Interview Cheat Sheet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
    <style>
        :root {
            --bg: #eceae6;
            --paper: #faf9f7;
            --ink: #1c1b19;
            --ink-muted: #5c5954;
            --border: #d9d5ce;
            --accent: #1f4e46;
            --accent-soft: #e4efec;
            --link: #1a5f8a;
            --code-bg: #f0eeea;
            --shadow: 0 1px 2px rgba(28, 27, 25, 0.06), 0 8px 24px rgba(28, 27, 25, 0.06);
            --measure: 42rem;
            --ui: "IBM Plex Sans", system-ui, sans-serif;
            --serif: "Source Serif 4", "Iowan Old Style", Georgia, serif;
            --mono: "IBM Plex Mono", ui-monospace, monospace;
        }
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--serif);
            font-size: 1.125rem;
            line-height: 1.75;
            color: var(--ink);
            background:
                radial-gradient(1200px 600px at 10% -10%, #e7ebe8 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 0%, #e9e4dc 0%, transparent 50%),
                var(--bg);
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 20;
            backdrop-filter: saturate(1.2) blur(10px);
            background: rgba(250, 249, 247, 0.92);
            border-bottom: 1px solid var(--border);
        }
        .topbar-inner {
            max-width: 56rem;
            margin: 0 auto;
            padding: 0.85rem 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }
        .brand {
            font-family: var(--ui);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--ink-muted);
            margin-right: auto;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }
        .actions a {
            font-family: var(--ui);
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--ink-muted);
            text-decoration: none;
        }
        .actions a:hover { color: var(--accent); text-decoration: underline; }
        main {
            max-width: 56rem;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 4rem;
        }
        .sheet {
            background: var(--paper);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: clamp(1.5rem, 4vw, 3rem) clamp(1.25rem, 4vw, 3.25rem);
            min-height: 70vh;
        }
        .doc-meta {
            font-family: var(--ui);
            font-size: 0.8rem;
            color: var(--ink-muted);
            margin: 0 0 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        #doc { max-width: var(--measure); margin: 0 auto; }
        #doc :is(h1, h2, h3, h4) {
            font-family: var(--serif);
            font-weight: 700;
            line-height: 1.25;
            letter-spacing: -0.01em;
            color: var(--ink);
            scroll-margin-top: 5rem;
        }
        #doc h1 {
            font-size: clamp(1.7rem, 3vw, 2.15rem);
            margin: 0 0 0.85em;
            padding-bottom: 0.35em;
            border-bottom: 1px solid var(--border);
        }
        #doc h2 { font-size: 1.4rem; margin: 1.8em 0 0.55em; }
        #doc h3 { font-size: 1.18rem; margin: 1.45em 0 0.4em; }
        #doc h4 { font-size: 1.05rem; margin: 1.25em 0 0.35em; }
        #doc p { margin: 0.85em 0; }
        #doc a { color: var(--link); text-underline-offset: 2px; }
        #doc strong { font-weight: 700; }
        #doc blockquote {
            margin: 1.1em 0;
            padding: 0.15em 0 0.15em 1em;
            color: var(--ink-muted);
            border-left: 3px solid var(--accent);
        }
        #doc ul, #doc ol { margin: 0.85em 0; padding-left: 1.35em; }
        #doc li { margin: 0.35em 0; }
        #doc li::marker { color: var(--ink-muted); }
        #doc hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }
        #doc table {
            width: 100%;
            border-collapse: collapse;
            font-family: var(--ui);
            font-size: 0.92rem;
            line-height: 1.45;
            margin: 1.2em 0;
            display: block;
            overflow-x: auto;
        }
        #doc th, #doc td {
            border: 1px solid var(--border);
            padding: 0.55rem 0.75rem;
            text-align: left;
            vertical-align: top;
        }
        #doc th { background: var(--code-bg); font-weight: 600; }
        #doc pre {
            font-family: var(--mono);
            font-size: 0.82rem;
            line-height: 1.55;
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.95rem 1.05rem;
            overflow-x: auto;
            margin: 1.1em 0;
        }
        #doc code { font-family: var(--mono); font-size: 0.86em; }
        #doc :not(pre) > code {
            background: var(--accent-soft);
            color: var(--accent);
            padding: 0.12em 0.38em;
            border-radius: 4px;
        }
        #err {
            margin: 0 0 1rem;
            padding: 0.9rem 1rem;
            background: #f8ecec;
            border: 1px solid #e2b6b6;
            border-radius: 8px;
            color: #7a1f1f;
            font-family: var(--ui);
            font-size: 0.95rem;
        }
        #err[hidden] { display: none; }
        .loading {
            font-family: var(--ui);
            color: var(--ink-muted);
            font-size: 0.95rem;
        }
        @media (max-width: 640px) {
            body { font-size: 1.05rem; line-height: 1.7; }
            .topbar-inner { padding: 0.75rem 0.9rem; }
            main { padding: 1rem 0.75rem 3rem; }
            .sheet { border-radius: 10px; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <div class="brand">Plugin Promotions</div>
            <div class="actions">
                <a id="downloadLink" href="" download>Download .md</a>
            </div>
        </div>
    </header>

    <main>
        <div class="sheet">
            <p class="doc-meta">
                <span>Interview Cheat Sheet</span>
                <span>Sumesh Ramasamy — 45 min</span>
            </p>
            <div id="err" hidden></div>
            <article id="doc" class="loading">Loading…</article>
        </div>
    </main>

    <script>
        (function () {
            const FILE = 'Plugin Promotions \u2014 Interview Cheat Sheet.md';
            const encoded = encodeURI(FILE);
            const errEl = document.getElementById('err');
            const docEl = document.getElementById('doc');
            const downloadLink = document.getElementById('downloadLink');
            downloadLink.href = encoded;
            downloadLink.setAttribute('download', FILE);

            async function main() {
                try {
                    const res = await fetch(encoded, { cache: 'no-cache' });
                    if (!res.ok) throw new Error('Could not load cheat sheet (' + res.status + ').');
                    const raw = await res.text();
                    docEl.className = '';
                    docEl.innerHTML = marked.parse(raw);
                } catch (e) {
                    docEl.textContent = '';
                    errEl.hidden = false;
                    errEl.textContent = e.message || String(e);
                }
            }
            main();
        })();
    </script>
</body>
</html>
